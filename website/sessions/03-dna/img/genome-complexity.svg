<rect x="780" y="442.0" width="300" height="24" rx="4" fill="none" stroke="#6a994e" stroke-width="2" stroke-dasharray="6 5"/>
<text x="930.0" y="459.0" font-size="15" fill="#6a994e" font-weight="700" text-anchor="middle">? not yet sequenced</text>
<rect x="625" y="505.0" width="560" height="120" rx="12" fill="#fdf0f1" stroke="#e63946" stroke-width="3"/>
<text x="905" y="537.0" font-size="20" font-weight="700" fill="#e63946" text-anchor="middle">Humans are not at the top of either ranking</text>
<text x="905" y="567.0" font-size="16" fill="#333" text-anchor="middle">A worm has as many genes as we do, and a fern has 50× more DNA.</text>
<text x="905" y="590.0" font-size="16" fill="#333" text-anchor="middle">Complexity depends on how genes are used: when they are</text>
<text x="905" y="613.0" font-size="16" fill="#333" text-anchor="middle">switched on, and how one gene can make several proteins.</text>
