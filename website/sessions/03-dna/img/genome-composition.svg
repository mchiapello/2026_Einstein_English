<text x="200" y="425" font-size="14" fill="#777" text-anchor="middle" font-style="italic">each square = 1 % of the genome</text>
<rect x="400" y="61" width="22" height="22" rx="4" fill="#e63946"/>
<text x="434" y="78" font-size="20" font-weight="700" fill="#333">Protein-coding (exons): <tspan fill="#e63946">1.5 %</tspan></text>
<text x="434" y="101" font-size="16" fill="#555">the instructions for making proteins</text>
<rect x="400" y="123" width="22" height="22" rx="4" fill="#e9a23b"/>
<text x="434" y="140" font-size="20" font-weight="700" fill="#333">Introns: <tspan fill="#e9a23b">26 %</tspan></text>
<text x="434" y="163" font-size="16" fill="#555">inside genes, cut out before the protein is made</text>
<rect x="400" y="185" width="22" height="22" rx="4" fill="#5b8fc7"/>
<text x="434" y="202" font-size="20" font-weight="700" fill="#333">“Jumping genes”: <tspan fill="#5b8fc7">44 %</tspan></text>
<text x="434" y="225" font-size="16" fill="#555">DNA that copied itself around the genome;</text>
<text x="434" y="245" font-size="16" fill="#555">some came from ancient viruses</text>
<rect x="400" y="267" width="22" height="22" rx="4" fill="#8e6bbf"/>
<text x="434" y="284" font-size="20" font-weight="700" fill="#333">Other repeats: <tspan fill="#8e6bbf">16 %</tspan></text>
<text x="434" y="307" font-size="16" fill="#555">short sequences repeated many times</text>
<rect x="400" y="329" width="22" height="22" rx="4" fill="#6a994e"/>
<text x="434" y="346" font-size="20" font-weight="700" fill="#333">Switches, RNA genes, unknown: <tspan fill="#6a994e">12.5 %</tspan></text>
<text x="434" y="369" font-size="16" fill="#555">turn genes on and off, and more</text>
<text x="890" y="438" font-size="12" fill="#999" text-anchor="end">Approximate values, after T. R. Gregory, Nature Reviews Genetics (2005)</text>
</svg>