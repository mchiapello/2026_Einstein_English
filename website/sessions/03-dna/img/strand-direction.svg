<text x="200" y="410" font-size="18" fill="#333" font-weight="400">The carbons of the sugar are numbered</text>
<text x="200" y="436" font-size="18" fill="#333" font-weight="400">1′ to 5′ ("one prime" … "five prime")</text>
<text x="200" y="476" font-size="18" fill="#1d5c9c" font-weight="700">the phosphate is attached to carbon 5′</text>
<text x="200" y="502" font-size="18" fill="#e9a23b" font-weight="700">carbon 3′ has a free OH, where</text>
<text x="200" y="528" font-size="18" fill="#e9a23b" font-weight="700">the next nucleotide can join</text>
<line x1="430" y1="30" x2="430" y2="540" stroke="#ddd" stroke-width="2"/>
<text x="715" y="40" font-size="21" font-weight="700" fill="#333">Two strands, opposite directions</text>
