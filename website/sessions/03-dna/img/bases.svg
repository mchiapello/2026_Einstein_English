<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Lato, Helvetica, Arial, sans-serif" text-anchor="middle">
  <line x1="320" y1="20" x2="320" y2="290" stroke="#ccc" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="160" y="35" font-size="22" font-weight="700" fill="#1d5c9c">PURINES</text>
  <text x="160" y="60" font-size="17" fill="#555">two rings</text>
  <text x="480" y="35" font-size="22" font-weight="700" fill="#1d5c9c">PYRIMIDINES</text>
  <text x="480" y="60" font-size="17" fill="#555">one ring</text>
  <!-- Adenine: hexagon centred (150,115) + fused pentagon on the left -->
  <polygon points="122.3,99 91.9,89.1 73.1,115 91.9,140.9 122.3,131" fill="#f7b5ba" stroke="#e63946" stroke-width="4"/>
  <polygon points="177.7,99 177.7,131 150,147 122.3,131 122.3,99 150,83" fill="#e63946" stroke="#e63946" stroke-width="4"/>
  <text x="150" y="124" font-size="26" font-weight="700" fill="#fff">A</text>
  <text x="235" y="122" font-size="18" fill="#333" text-anchor="start">Adenine</text>
  <!-- Guanine -->
  <polygon points="122.3,189 91.9,179.1 73.1,205 91.9,230.9 122.3,221" fill="#b9d3a6" stroke="#6a994e" stroke-width="4"/>
  <polygon points="177.7,189 177.7,221 150,237 122.3,221 122.3,189 150,173" fill="#6a994e" stroke="#6a994e" stroke-width="4"/>
  <text x="150" y="214" font-size="26" font-weight="700" fill="#fff">G</text>
  <text x="235" y="212" font-size="18" fill="#333" text-anchor="start">Guanine</text>
  <!-- Cytosine -->
  <polygon points="447.7,99 447.7,131 420,147 392.3,131 392.3,99 420,83" fill="#8e6bbf" stroke="#8e6bbf" stroke-width="4"/>
  <text x="420" y="124" font-size="26" font-weight="700" fill="#fff">C</text>
  <text x="470" y="122" font-size="18" fill="#333" text-anchor="start">Cytosine</text>
  <!-- Thymine -->
  <polygon points="447.7,189 447.7,221 420,237 392.3,221 392.3,189 420,173" fill="#f4c95d" stroke="#c99a1e" stroke-width="4"/>
  <text x="420" y="214" font-size="26" font-weight="700" fill="#7a5a00">T</text>
  <text x="470" y="212" font-size="18" fill="#333" text-anchor="start">Thymine</text>
  <text x="160" y="285" font-size="18" font-style="italic" fill="#555">"Pure As Gold"</text>
  <text x="480" y="285" font-size="18" font-style="italic" fill="#555">"CUT the Py" (U = uracil, in RNA)</text>
</svg>
