<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 175" font-family="Lato, Helvetica, Arial, sans-serif" text-anchor="middle">
<defs><marker id="ah4" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#555"/></marker></defs>
<line x1="115" y1="70" x2="895" y2="70" stroke="#ccc" stroke-width="4"/>
<circle cx="115" cy="70" r="11" fill="#1d5c9c"/>
<text x="115" y="34" font-size="26" font-weight="700" fill="#1d5c9c">1 m</text>
<text x="115" y="54" font-size="15" fill="#555">metre</text>
<text x="115" y="104" font-size="16" fill="#333">= 1 m</text>
<text x="115" y="128" font-size="16" font-style="italic" fill="#555">you ≈ 1.7 m</text>
<circle cx="375" cy="70" r="11" fill="#6a994e"/>
<text x="375" y="34" font-size="26" font-weight="700" fill="#6a994e">1 mm</text>
<text x="375" y="54" font-size="15" fill="#555">millimetre</text>
<text x="375" y="104" font-size="16" fill="#333">= 0.001 m</text>
<text x="375" y="128" font-size="16" font-style="italic" fill="#555">a pinhead ≈ 1 mm</text>
<circle cx="635" cy="70" r="11" fill="#e9a23b"/>
<text x="635" y="34" font-size="26" font-weight="700" fill="#e9a23b">1 µm</text>
<text x="635" y="54" font-size="15" fill="#555">micrometre</text>
<text x="635" y="104" font-size="16" fill="#333">= 0.000 001 m</text>
<text x="635" y="128" font-size="16" font-style="italic" fill="#555">a cell ≈ 10 µm</text>
<circle cx="895" cy="70" r="11" fill="#e63946"/>
<text x="895" y="34" font-size="26" font-weight="700" fill="#e63946">1 nm</text>
<text x="895" y="54" font-size="15" fill="#555">nanometre</text>
<text x="895" y="104" font-size="16" fill="#333">= 0.000 000 001 m</text>
<text x="895" y="128" font-size="16" font-style="italic" fill="#555">DNA ≈ 2 nm wide</text>
<path d="M200.0 70 h90" stroke="#555" stroke-width="3" marker-end="url(#ah4)"/>
<rect x="207.0" y="80" width="76" height="22" rx="11" fill="#fff"/><text x="245.0" y="97" font-size="16" font-weight="700" fill="#555">÷ 1,000</text>
<path d="M460.0 70 h90" stroke="#555" stroke-width="3" marker-end="url(#ah4)"/>
<rect x="467.0" y="80" width="76" height="22" rx="11" fill="#fff"/><text x="505.0" y="97" font-size="16" font-weight="700" fill="#555">÷ 1,000</text>
<path d="M720.0 70 h90" stroke="#555" stroke-width="3" marker-end="url(#ah4)"/>
<rect x="727.0" y="80" width="76" height="22" rx="11" fill="#fff"/><text x="765.0" y="97" font-size="16" font-weight="700" fill="#555">÷ 1,000</text>
<text x="500" y="164" font-size="17" font-weight="700" fill="#1d5c9c">1 metre = 1,000 mm = 1,000,000 µm = 1,000,000,000 nm</text>
</svg>