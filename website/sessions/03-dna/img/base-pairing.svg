<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Lato, Helvetica, Arial, sans-serif" text-anchor="middle">
  <rect x="40" y="30" width="22" height="210" rx="6" fill="#1d5c9c"/>
  <rect x="338" y="30" width="22" height="210" rx="6" fill="#5b8fc7"/>
  <text x="51" y="265" font-size="15" fill="#555">backbone</text>
  <text x="349" y="265" font-size="15" fill="#555">backbone</text>
  <!-- A = T -->
  <rect x="62" y="60" width="150" height="50" rx="6" fill="#e63946"/>
  <text x="137" y="94" font-size="26" font-weight="700" fill="#fff">A</text>
  <rect x="244" y="60" width="94" height="50" rx="6" fill="#f4c95d"/>
  <text x="291" y="94" font-size="26" font-weight="700" fill="#7a5a00">T</text>
  <g stroke="#333" stroke-width="3" stroke-dasharray="4 4"><line x1="212" y1="75" x2="244" y2="75"/><line x1="212" y1="95" x2="244" y2="95"/></g>
  <!-- G ≡ C -->
  <rect x="62" y="160" width="150" height="50" rx="6" fill="#6a994e"/>
  <text x="137" y="194" font-size="26" font-weight="700" fill="#fff">G</text>
  <rect x="244" y="160" width="94" height="50" rx="6" fill="#8e6bbf"/>
  <text x="291" y="194" font-size="26" font-weight="700" fill="#fff">C</text>
  <g stroke="#333" stroke-width="3" stroke-dasharray="4 4"><line x1="212" y1="170" x2="244" y2="170"/><line x1="212" y1="185" x2="244" y2="185"/><line x1="212" y1="200" x2="244" y2="200"/></g>
  <g text-anchor="start">
    <text x="395" y="82" font-size="24" font-weight="700" fill="#333">A — T</text>
    <text x="395" y="106" font-size="17" fill="#555">2 hydrogen bonds</text>
    <text x="395" y="182" font-size="24" font-weight="700" fill="#333">G — C</text>
    <text x="395" y="206" font-size="17" fill="#555">3 hydrogen bonds</text>
  </g>
  <text x="200" y="20" font-size="16" fill="#555">purine + pyrimidine: every rung has the same width</text>
</svg>
