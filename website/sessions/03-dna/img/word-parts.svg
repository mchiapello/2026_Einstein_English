<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="Lato, Helvetica, Arial, sans-serif" text-anchor="middle">
  <rect x="25" y="20" width="150" height="70" rx="12" fill="#e63946"/>
  <rect x="195" y="20" width="150" height="70" rx="12" fill="#e9a23b"/>
  <rect x="365" y="20" width="150" height="70" rx="12" fill="#6a994e"/>
  <rect x="535" y="20" width="150" height="70" rx="12" fill="#1d5c9c"/>
  <g font-size="30" font-weight="700" fill="#fff">
    <text x="100" y="66">deoxy</text><text x="270" y="66">ribo</text><text x="440" y="66">nucleic</text><text x="610" y="66">acid</text>
  </g>
  <g font-size="17" fill="#333">
    <text x="100" y="122">"without oxygen":</text><text x="100" y="145">the sugar is missing</text><text x="100" y="168">one oxygen atom</text>
    <text x="270" y="122">ribose:</text><text x="270" y="145">the name of</text><text x="270" y="168">the sugar</text>
    <text x="440" y="122">first found in</text><text x="440" y="145">the cell nucleus</text><text x="440" y="168">(1869)</text>
    <text x="610" y="122">the phosphate</text><text x="610" y="145">groups make the</text><text x="610" y="168">molecule acidic</text>
  </g>
  <text x="350" y="215" font-size="19" font-weight="700" fill="#1d5c9c">DNA = deoxyribonucleic acid</text>
</svg>
